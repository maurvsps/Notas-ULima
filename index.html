<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promedia — Redirigiendo a la nueva versión...</title>
  
  <!-- Redirección inmediata (0 segundos) -->
  <meta http-equiv="refresh" content="0; url=https://promedia-sim.web.app/">
  <link rel="canonical" href="https://promedia-sim.web.app/">
  
  <script>
    // Redirección ultra rápida por JS
    window.location.replace("https://promedia-sim.web.app/" + window.location.search + window.location.hash);
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 8px 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #f97316;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 14px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn:hover {
      background: #ea580c;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-icon">🎓</div>
    <h1>¡Nos hemos mudado!</h1>
    <p>La versión oficial y actualizada del simulador ahora está en <b>promedia-sim.web.app</b>.</p>
    <div class="spinner"></div>
    <p style="font-size:12px; color:#64748b;">Redirigiendo automáticamente...</p>
    <a href="https://promedia-sim.web.app/" class="btn">Entrar a Promedia →</a>
  </div>

</body>
</html>
